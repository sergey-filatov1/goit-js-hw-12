<!DOCTYPE html>
<html lang="uk">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image search</title>
  <link rel="stylesheet" href="./css/styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/simplelightbox/2.14.3/simple-lightbox.min.css" />
</head>

<body>
  <form class="form">
    <input type="text" name="search-text" placeholder="Search images..." />
    <button type="submit">Search</button>
  </form>

  <span class="loader" hidden></span>

  <ul class="gallery"></ul>

  <button type="button" class="load-more" hidden>
    Load more
  </button>

  <script type="module" src="./main.js"></script>
</body>

</html>
